<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 기초 5차시 — AI에게 그림 부탁하기</title>
<style>
:root{
  --bg:#F4F6FA; --ink:#191F28; --sub:#6B7684; --card:#FFFFFF;
  --accent:#3182F6; --accent-deep:#1B64DA; --accent-soft:#EBF3FF;
  --green:#0BA360; --green-soft:#E6F6EC; --sun:#FFC342; --sun-soft:#FFF4D6;
  --hair:rgba(25,31,40,.07);
  --shadow-sm:0 1px 3px rgba(25,31,40,.05), 0 4px 14px rgba(25,31,40,.06);
  --shadow-md:0 2px 6px rgba(25,31,40,.05), 0 14px 34px rgba(25,31,40,.10);
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column;
  min-height:100vh; min-height:100dvh;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none;}
button:focus-visible{outline:4px solid #94C1FF; outline-offset:3px;}

/* ===== 셸 ===== */
header{
  display:flex; align-items:center; gap:14px;
  padding:14px 22px; background:var(--card);
  box-shadow:0 1px 0 var(--hair), 0 4px 16px rgba(25,31,40,.04);
  position:relative; z-index:5;
}
#title{
  flex:1; text-align:center; font-weight:800;
  font-size:clamp(20px,2.2vw,30px); letter-spacing:-.5px;
}
.hbtn{
  min-height:68px; padding:10px 26px; border-radius:999px;
  background:#F2F4F8; font-weight:700;
  font-size:clamp(17px,1.7vw,24px);
  transition:background .15s ease, transform .1s ease;
}
.hbtn:hover{background:#E8ECF2;}
.hbtn:active{transform:scale(.96);}

main#stage{
  flex:1; min-height:0; overflow:auto;
  display:flex; flex-direction:column; align-items:center;
  padding:20px 22px;
}
footer#dots{
  display:flex; align-items:center; justify-content:center; gap:10px; padding:16px;
  flex-wrap:wrap;
}
footer#dots:empty{display:none;}
.d{width:13px; height:13px; border-radius:999px; background:#D8DEE8; transition:all .25s ease;}
.d.done{background:var(--green);}
.d.cur{width:38px; background:var(--accent);}

/* ===== 지시문 ===== */
.say{
  margin:6px 0 12px; text-align:center; font-weight:800;
  font-size:clamp(24px,3.1vw,40px); letter-spacing:-1px; text-wrap:balance;
}

/* ===== 홈 ===== */
.home{width:100%; max-width:1500px; text-align:center; margin:auto;}
.home h1{font-size:clamp(30px,3.8vw,52px); font-weight:800; letter-spacing:-1.5px;}
.cards{display:flex; gap:26px; justify-content:center; flex-wrap:wrap; margin-top:34px;}
.card{
  position:relative; width:min(330px,90vw); min-height:300px;
  background:var(--card); border-radius:32px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  box-shadow:var(--shadow-sm);
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-6px); box-shadow:var(--shadow-md);}
.card:active{transform:translateY(0) scale(.98);}
.cicon{
  width:140px; height:140px; border-radius:50%; background:var(--accent-soft);
  display:flex; align-items:center; justify-content:center;
  font-size:72px; line-height:1;
}
.cname{font-size:clamp(23px,2.3vw,32px); font-weight:800; letter-spacing:-.5px; padding:0 12px;}
.badge{
  position:absolute; top:18px; right:18px; background:var(--green-soft); color:#087F46;
  border-radius:999px; padding:9px 18px; font-weight:800; font-size:17px;
}
.pickerlink{
  display:inline-block; margin-top:34px; padding:14px 30px; border-radius:999px;
  background:var(--card); color:var(--sub); font-weight:700;
  font-size:clamp(17px,1.8vw,23px); text-decoration:none; box-shadow:var(--shadow-sm);
  transition:transform .12s ease, color .12s ease;
}
.pickerlink:hover{color:var(--accent); transform:translateY(-2px);}
.pickerlink:focus-visible{outline:4px solid #94C1FF; outline-offset:3px;}

/* ===== 큰 버튼 ===== */
.big-btn{
  flex:none;
  min-height:88px; min-width:260px; padding:16px 46px;
  border-radius:999px;
  background:var(--accent); color:#fff; font-weight:800;
  font-size:clamp(23px,2.4vw,32px); letter-spacing:-.5px;
  box-shadow:0 10px 26px rgba(49,130,246,.35);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.big-btn:hover{filter:brightness(1.06);}
.big-btn:active{transform:translateY(2px) scale(.98); box-shadow:0 5px 14px rgba(49,130,246,.3);}
.big-btn.green{background:var(--green); box-shadow:0 10px 26px rgba(11,163,96,.35);}
.big-btn.green:active{box-shadow:0 5px 14px rgba(11,163,96,.3);}
.big-btn[disabled]{background:#D8DEE8; color:#8B95A5; box-shadow:none; cursor:default;}
.big-btn[disabled]:hover{filter:none;}
.big-btn[disabled]:active{transform:none;}
/* 새 탭으로 나가는 링크도 큰 버튼과 똑같이 보이게 (<a>라서 따로 맞춰 준다) */
.big-btn.ext{
  display:inline-flex; align-items:center; justify-content:center;
  text-decoration:none; color:#fff;
}
.btnrow{
  display:flex; gap:20px; justify-content:center; align-items:center; flex-wrap:wrap;
  margin-top:14px; flex:none;
}

/* ===== 무대 공통 ===== */
.scene{
  flex:1; width:100%; max-width:1200px; min-height:0;
  display:flex; align-items:center; justify-content:center; gap:28px;
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}

/* ===== 칭찬 오버레이 ===== */
#praise{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.94); backdrop-filter:blur(6px);
}
#praise[hidden]{display:none;}
#praise .pop{
  text-align:center; font-size:clamp(44px,7vw,88px); font-weight:800; letter-spacing:-2px;
  color:var(--green); animation:popin .45s cubic-bezier(.2,1.6,.4,1);
}
#praise .pop .pe{font-size:clamp(80px,13vw,170px); display:block;}
@keyframes popin{from{transform:scale(.3); opacity:0;}to{transform:scale(1); opacity:1;}}

/* ===== 소개 카드 ===== */
.introrow{flex-wrap:wrap;}
.np-card{
  flex:1; min-width:280px; max-width:440px; background:var(--card);
  border-radius:28px; padding:30px; text-align:center; box-shadow:var(--shadow-sm);
}
.np-card p{font-size:clamp(21px,2.3vw,30px); font-weight:800; margin:12px 0 0; letter-spacing:-.5px;}
.np-card .art{font-size:74px; line-height:1.15;}

/* ===== 문장 만들기 =====
   낱말칸·트레이·버튼은 항상 화면에 남고, 넘치면 .swap만 스크롤된다.
   1024×600에서 이게 안 되면 학생이 복사 버튼을 못 찾는다. */
/* 940px이면 1366 화면에서 낱말 카드 7장이 한 줄에 안 들어가 두 줄이 된다.
   문장칸·트레이는 940으로 두고 전체 폭만 넓힌다(카드가 퍼질 자리). */
.buildwrap{
  width:100%; max-width:1180px; margin:0 auto; flex:1; min-height:0;
  display:flex; flex-direction:column;
}
.sentence, .tray{width:100%; max-width:940px; margin-left:auto; margin-right:auto;}
/* 만든 문장 — 절대 스크롤하지 않는다. 문장 전체가 항상 보여야 한다. */
.sentence{
  flex:none; display:flex; align-items:center; justify-content:center;
  gap:10px; flex-wrap:wrap;
  min-height:clamp(64px,9vh,86px); padding:10px 18px;
  background:var(--card); border-radius:20px; box-shadow:var(--shadow-sm);
  border:4px solid transparent;
  transition:border-color .2s ease, background .2s ease;
}
.sentence.ready{border-color:var(--accent); background:var(--accent-soft);}
/* 낱말이 들어갈 칸 — 비어 있으면 회색 점선, 채워지면 파란 글씨 */
.sl{
  min-width:110px; padding:4px 12px; text-align:center;
  font-size:clamp(22px,2.3vw,30px); font-weight:800; letter-spacing:-.5px;
  border-bottom:5px solid #C6CDD9; color:#C6CDD9;
  transition:color .15s ease, border-color .15s ease;
}
.sl i{font-style:normal; font-size:.72em;}
.sl.on{border-bottom-color:var(--accent); color:var(--accent-deep);}

/* ===== 클립보드 트레이 =====
   복사는 눌러도 화면에 아무 일이 없어 보인다 — 그게 제일 어려운 점이다.
   그래서 '어디에 담겼는지'를 눈에 보이는 자리로 만들었다.
   상태는 애니메이션이 아니라 클래스로 남긴다(모션을 꺼도 담긴 게 보여야 한다). */
.tray{
  flex:none; display:flex; align-items:center; gap:14px;
  margin-top:10px; padding:12px 20px;
  background:var(--card); border-radius:20px; box-shadow:var(--shadow-sm);
  border:4px dashed #D8DEE8;
  transition:border-color .2s ease, background .2s ease;
}
.tray .tico{font-size:40px; line-height:1; flex:none;}
.tray .ttext{
  flex:1; text-align:left; font-size:clamp(19px,2vw,26px); font-weight:800;
  letter-spacing:-.5px; color:#C6CDD9; word-break:keep-all;
}
.tray.full{border-style:solid; border-color:var(--green); background:var(--green-soft);}
.tray.full .ttext{color:#087F46;}
.tray.pop{animation:traypop .45s cubic-bezier(.2,1.6,.4,1);}
@keyframes traypop{0%{transform:scale(1);}45%{transform:scale(1.05);}100%{transform:scale(1);}}
/* 문장이 트레이로 날아가는 고스트 */
.ghost{
  position:fixed; z-index:40; pointer-events:none;
  padding:12px 22px; border-radius:18px;
  background:var(--accent); color:#fff; font-weight:800;
  font-size:clamp(20px,2.1vw,28px); letter-spacing:-.5px;
  box-shadow:0 10px 26px rgba(49,130,246,.4);
  animation:flyto .55s cubic-bezier(.4,0,.5,1) forwards;
}
@keyframes flyto{
  0%{transform:translate(0,0) scale(1); opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(.5); opacity:.15;}
}
@media (prefers-reduced-motion:reduce){
  .ghost{display:none;}
  .tray{transition:none;}
}

/* ===== 복사·붙여넣기 버튼 ===== */
.actionrow{
  flex:none; display:flex; gap:18px; justify-content:center; align-items:center;
  flex-wrap:wrap; margin-top:10px;
}
.actbtn{
  min-height:clamp(64px,9vh,86px); min-width:200px; padding:12px 30px;
  border-radius:20px; background:var(--accent); color:#fff; font-weight:800;
  font-size:clamp(21px,2.2vw,28px); letter-spacing:-.5px;
  box-shadow:0 6px 18px rgba(49,130,246,.32);
  transition:transform .12s ease, filter .12s ease;
}
.actbtn:hover{filter:brightness(1.06);}
.actbtn:active{transform:translateY(2px) scale(.98);}
.actbtn.green{background:var(--green); box-shadow:0 6px 18px rgba(11,163,96,.32);}
.actbtn[disabled]{background:#D8DEE8; color:#8B95A5; box-shadow:none; cursor:default;}
.actbtn[disabled]:hover{filter:none;}
.actbtn[disabled]:active{transform:none;}

/* ===== 낱말 카드 / AI창이 번갈아 들어가는 자리 =====
   둘을 동시에 두면 1024×600에 들어가지 않는다. 그래서 같은 칸을 바꿔 쓴다. */
/* 낱말카드일 때는 열 안에서만 스크롤한다(.colcards).
   AI창·제미나이 안내가 들어오면 이 칸 자체가 스크롤된다. */
.swap{flex:1; min-height:0; overflow-y:auto; margin-top:10px;}
.swap:has(.slotcols){overflow-y:hidden;}
/* 갈래 고르기 — 낱말이 많아서 한 화면에 다 펼칠 수 없다.
   갈래를 먼저 누르면 그 안의 낱말만 보인다(한 번에 6장).
   ★ 칸마다 세로 열을 하나씩 준다(어떤 | 무엇을 | 해 줘).
     탭과 낱말이 같은 열에 있어서 '이 탭은 어느 칸용인지'가 자리로 보이고,
     한 줄에 늘어놓을 때처럼 줄바꿈이 옆 칸을 침범하지 않는다.
     2칸 스텝은 열이 2개가 되고, 코드는 그대로다. */
.slotcols{display:flex; gap:12px; align-items:stretch; justify-content:center; height:100%;}
.slotcol{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column;
  background:var(--card); border-radius:20px; box-shadow:var(--shadow-sm);
  padding:9px 10px;
}
/* '해 줘'처럼 카드가 하나뿐인 칸은 자리를 적게 준다 — 낱말 칸이 넓어야 한다 */
.slotcol.thin{flex:0 0 auto; min-width:132px;}
.slothead{
  flex:none; text-align:center; margin-bottom:7px;
  font-size:clamp(15px,1.6vw,19px); font-weight:800; letter-spacing:-.5px; color:var(--sub);
}
/* 다 고른 칸은 초록으로 — 어디를 더 채워야 하는지 한눈에 보인다 */
.slotcol.filled .slothead{color:#087F46;}
.slotcol.filled{background:var(--green-soft);}
.grouprow{
  flex:none; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:7px;
}
/* 열 안에서 낱말만 스크롤된다 — 탭은 늘 보인다 */
.colcards{flex:1; min-height:0; overflow-y:auto;}
.gtab{
  min-height:60px; min-width:104px; padding:7px 14px;
  border-radius:999px; background:var(--card); box-shadow:var(--shadow-sm);
  border:3px solid transparent;
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-size:clamp(17px,1.8vw,22px); font-weight:800; letter-spacing:-.5px; color:var(--sub);
  transition:transform .12s ease, border-color .12s ease, color .12s ease;
}
.gtab:hover{transform:translateY(-2px);}
.gtab .gpic{font-size:clamp(22px,2.4vw,30px); line-height:1;}
/* 지금 보고 있는 갈래 — 테두리와 색으로 알린다(색 하나에만 기대지 않는다) */
.gtab.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep);}
.gtab[disabled]{opacity:.45; cursor:default;}
.gtab[disabled]:hover{transform:none;}

/* 열 안에서 카드를 두 칸씩 깐다(6장 → 3줄).
   한 줄에 하나씩 세로로 쌓으면 6장이 600px 화면에 절대 안 들어간다(실제로 재 봤다).
   폭이 좁으니 이모지와 글자를 옆으로 눕힌다 — 위아래로 두면 카드가 높아진다. */
.wordcards{display:grid; grid-template-columns:1fr 1fr; gap:8px; align-content:start;}
/* 카드가 하나뿐인 칸('해 줘')은 한 줄을 다 쓴다 */
.slotcol.thin .wordcards{grid-template-columns:1fr;}
.wordcards .wcard{
  width:100%; min-width:0; min-height:56px; padding:7px 9px;
  flex-direction:row; gap:7px;
}
.wordcards .wcard .wtxt{
  flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.wordcards .wcard .wpic{flex:none;}
/* '해 줘' 카드는 갈래에 속하지 않는다 — 노란 테두리로 구분해 늘 같은 자리에 둔다 */
.wcard.do{border-color:var(--sun);}
.wcard.do.used{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep);}
/* 낱말 카드 — 이모지와 글자를 함께 둔다.
   못 읽는 학생은 그림으로, 읽는 학생은 글자로 고른다. 누르면 읽어 준다. */
.wcard{
  min-width:150px; min-height:88px; padding:10px 18px;
  border-radius:20px; background:var(--card); box-shadow:var(--shadow-sm);
  border:4px solid transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition:transform .12s ease, border-color .12s ease;
}
.wcard:hover{transform:translateY(-3px);}
.wcard .wpic{font-size:clamp(30px,3.4vw,44px); line-height:1.1;}
.wcard .wtxt{
  font-size:clamp(18px,1.9vw,24px); font-weight:800; letter-spacing:-.5px;
  word-break:keep-all;
}
.wcard.used{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep);}
.wcard[disabled]{opacity:.45; cursor:default;}
.wcard[disabled]:hover{transform:none;}

/* ===== 연습용 AI 창 ===== */
.aiwin{
  background:var(--card); border-radius:24px; box-shadow:var(--shadow-sm);
  padding:14px 18px; display:flex; flex-direction:column; gap:12px;
}
/* 붙여넣은 말이 들어가는 자리 */
.aiin{
  min-height:56px; padding:10px 16px; border-radius:16px;
  background:#F1F3F7; color:var(--ink);
  font-size:clamp(19px,2vw,26px); font-weight:800; letter-spacing:-.5px;
  display:flex; align-items:center; word-break:keep-all;
}
.aiin:empty::before{content:'여기에 붙여넣어요'; color:#C6CDD9;}
.aiout{
  display:flex; align-items:center; gap:16px;
  padding:10px 16px; border-radius:16px; background:var(--sun-soft);
  animation:bubblein .3s ease;
}
@keyframes bubblein{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}
.aipic{font-size:clamp(56px,8vw,92px); line-height:1.1; flex:none;}
.ailine{
  font-size:clamp(19px,2vw,26px); font-weight:800; letter-spacing:-.5px;
  color:#5C4200; text-align:left; word-break:keep-all;
}

/* ===== 진짜 AI로 가는 안내 ===== */
.guide{display:flex; flex-direction:column; gap:10px; align-items:center; margin-bottom:14px;}
.gstep{
  display:flex; align-items:center; gap:12px;
  font-size:clamp(19px,2vw,26px); font-weight:800; letter-spacing:-.5px;
}
.gstep b{
  flex:none; width:38px; height:38px; border-radius:50%;
  background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:21px;
}
/* 2차시 화면 키보드와 같은 시각 언어로 Ctrl+V를 보여 준다 */
kbd{
  display:inline-block; min-width:46px; padding:7px 13px;
  background:var(--card); border-radius:8px; box-shadow:0 2px 0 #D0D7E2;
  font-family:inherit; font-weight:800; font-size:clamp(17px,1.8vw,22px);
}
.extwrap{display:flex; justify-content:center;}

.hintline{
  margin:10px 0 0; text-align:center; flex:none;
  font-size:clamp(18px,1.9vw,24px); font-weight:800; color:var(--sub);
  letter-spacing:-.5px; text-wrap:balance;
}
/* 힌트가 비면 자리도 없앤다 — 안 그러면 빈 줄의 margin이 그대로 남는다 */
.hintline:empty{display:none;}

/* ===== 정리 카드 ===== */
.recap{
  background:var(--card); border-radius:30px; padding:28px 32px;
  box-shadow:var(--shadow-sm); max-width:940px; margin:0 auto; text-align:center; flex:none;
}
.recap .ri{font-size:clamp(54px,7vw,86px); line-height:1.1;}
.recap h2{
  margin:8px 0 14px; font-size:clamp(25px,2.9vw,38px); font-weight:800;
  letter-spacing:-1px; color:var(--accent-deep); text-wrap:balance;
}
.recap p{
  margin:0 0 12px; font-size:clamp(20px,2.1vw,28px); font-weight:700;
  line-height:1.55; color:var(--ink); text-wrap:balance;
}

<body>
<header>
  <button class="hbtn" id="homeBtn" type="button">🏠 처음으로</button>
  <div id="title">AI에게 그림 부탁하기</div>
  <button class="hbtn" id="volBtn" type="button" aria-label="소리 조절">🔊</button>
  <button class="hbtn" id="ttsBtn" type="button">💬 다시 듣기</button>
</header>
<main id="stage"></main>
<footer id="dots"></footer>
<div id="praise" hidden></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), dots = $('#dots');

/* ===== 음성 (TTS) ===== */
let koVoice = null, lastTts = '';
function pickVoice(){
  try{ koVoice = speechSynthesis.getVoices().find(v => v.lang.replace('_','-').startsWith('ko')) || null; }catch(e){}
}
try{ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }catch(e){}
const VOLS = [
  {v:1,   icon:'🔊', name:'소리 크게'},
  {v:.35, icon:'🔉', name:'소리 작게'},
  {v:0,   icon:'🔇', name:'소리 끔'},
];
let volIdx = 0;
try{ volIdx = (+localStorage.getItem('digibasic_vol') || 0) % 3; }catch(e){}
function updateVolBtn(){
  const s = VOLS[volIdx];
  $('#volBtn').textContent = s.icon;
  $('#volBtn').setAttribute('aria-label', s.name);
}
$('#volBtn').onclick = e => {
  e.currentTarget.blur();
  volIdx = (volIdx + 1) % 3;
  try{ localStorage.setItem('digibasic_vol', volIdx); }catch(e2){}
  updateVolBtn();
  speak(VOLS[volIdx].name + '로 바꿨어요');
};
function speak(t){
  if(!t) return;
  lastTts = t;
  console.log('[tts]', t);
  if(!VOLS[volIdx].v) return;
  try{
    speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ko-KR'; u.rate = .85; u.pitch = 1.02;
      u.volume = VOLS[volIdx].v;
      if(koVoice) u.voice = koVoice;
      speechSynthesis.speak(u);
    }, 60);
  }catch(e){}
}
updateVolBtn();
document.addEventListener('pointerdown', () => {
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
}, {once:true});
$('#ttsBtn').onclick = e => { e.currentTarget.blur(); speak(lastTts); };

/* ===== 진행 상태 ===== */
const KEY = 'digibasic_l5_v1';
let done = {};
try{ done = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
function saveDone(id){ done[id] = true; try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }
/* filled: {역할: 낱말}. 카드를 누른 순서와 상관없이 역할이 자리를 정한다.
   clip: 복사한 말. 붙여넣기는 진짜 클립보드가 아니라 이걸 읽는다(아래 설명). */
/* gi: 지금 보고 있는 갈래(GROUPS 인덱스). 낱말 선택과는 별개다 —
   갈래를 바꿔도 이미 고른 낱말은 그대로 남는다. */
const S = { screen:'home', mi:-1, si:0, filled:{}, clip:'', copied:false, pasted:false,
            phase:'build', gi:0 };
let busy = false;

/* ===== 클립보드 =====
   진짜 클립보드에 쓰되, 되든 안 되든 화면 흐름은 똑같아야 한다.
   1파트(연습)도 진짜로 복사한다 — 2파트에서만 진짜로 하면 연습이 실물과 달라져
   막상 제미나이 앞에서 처음 하는 일이 되어 버린다. */
function copyToClipboard(text, cb){
  let settled = false;
  const finish = ok => {
    if(settled) return;
    settled = true;
    console.log('[clip]', ok ? 'ok' : 'fail', text);
    cb && cb(ok);            // ok가 false여도 부르는 쪽은 그냥 진행한다
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(() => finish(true))
        .catch(() => finish(execCopy(text)));
      return;
    }
  }catch(e){}
  finish(execCopy(text));
}
/* 구식 폴백. <input>을 쓰지 않으므로 화면 밖 <span>을 선택해서 복사한다.
   ★ body의 user-select:none이 상속되면 선택이 비어 복사가 실패한다 — 반드시 풀어 준다. */
function execCopy(text){
  let ok = false, host = null;
  try{
    host = document.createElement('span');
    host.textContent = text;
    host.style.cssText = 'position:fixed; left:-9999px; top:0; white-space:pre; ' +
                         'user-select:text; -webkit-user-select:text;';
    document.body.appendChild(host);
    const sel = window.getSelection(), range = document.createRange();
    range.selectNodeContents(host);
    sel.removeAllRanges(); sel.addRange(range);
    ok = document.execCommand('copy');
    sel.removeAllRanges();
  }catch(e){ ok = false; }
  finally{ if(host && host.parentNode) host.parentNode.removeChild(host); }
  return ok;
}

/* ===== 문장 만들기 도우미 =====
   칸이 몇 개든 그대로 동작한다 — 역할 이름을 코드가 알 필요가 없다.
   다음 차시에서 칸을 늘릴 때(파란 / 고양이 / 그려 줘) 데이터만 고치면 된다. */
function sentenceText(step){
  return step.slots.map(s => S.filled[s.role]).filter(Boolean).join(' ');
}
function isComplete(step){
  return step.slots.every(s => S.filled[s.role]);
}

/* 복사 — 진짜 클립보드에 쓰고, 트레이에 담긴 것을 눈으로 보여 준다 */
function doCopy(step, after){
  if(S.copied || !isComplete(step)) return;
  S.clip = sentenceText(step);
  S.copied = true;
  copyToClipboard(S.clip);     // 성공 여부를 화면에 표시하지 않는다 — 실패 상태를 만들지 않는다
  speak('말을 복사했어요');
  flyToTray(after);
}

/* 문장이 트레이로 날아가 담긴다.
   ★ 애니메이션이 꺼져 있거나 좌표가 깨져도 '담김' 상태는 반드시 남아야 한다. */
function flyToTray(after){
  const src = $('#sentence'), tray = $('#tray');
  const setFull = () => {
    if(tray){
      tray.classList.add('full','pop');
      const tt = $('#trayText');
      if(tt) tt.textContent = '📋 ' + S.clip;
      setTimeout(() => tray.classList.remove('pop'), 500);
    }
    after && after();
  };
  let reduce = false;
  try{ reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce || !src || !tray){ setFull(); return; }
  try{
    const a = src.getBoundingClientRect(), b = tray.getBoundingClientRect();
    const g = document.createElement('div');
    g.className = 'ghost';
    g.textContent = S.clip;
    g.style.left = a.left + 'px';
    g.style.top = a.top + 'px';
    g.style.setProperty('--dx', (b.left + 20 - a.left) + 'px');
    g.style.setProperty('--dy', (b.top + 8 - a.top) + 'px');
    document.body.appendChild(g);
    setTimeout(() => { g.remove(); setFull(); }, 520);
  }catch(e){ setFull(); }
}

/* ===== 연습용 AI의 답 =====
   그림과 글을 함께 낸다 — 그림만이면 읽어 줄 것이 없고,
   글만이면 붙여넣기가 통했다는 느낌이 약하다.
   ★ 조합 이모지(🐈‍⬛ 같은 것)는 윈도우에서 깨진다. 단일 이모지만 쓸 것. */
const REPLIES = {
  /* 동물 */
  '고양이': {pic:'🐱', line:'네! 고양이 그림이에요.'},
  '강아지': {pic:'🐶', line:'네! 강아지 그림이에요.'},
  '토끼':   {pic:'🐰', line:'네! 귀여운 토끼예요.'},

/* 그림을 정하는 건 '무엇을' 칸이다. '해 줘' 칸은 그림에 영향이 없다.
   ★ '어떤' 칸은 REPLIES에 넣지 않는다(18개 × 36개 = 648줄이 된다).
     대신 고른 말을 답 문장 앞에 붙인다 — 색을 골라도 답이 똑같으면
     고른 의미가 없어져서 '어떤' 칸을 왜 채웠는지 알 수 없다. */
function replyFor(step){
  const key = S.filled[step.picFrom || 'what'];
  const r = REPLIES[key] || DEFAULT_REPLY;
  const desc = S.filled.desc;
  if(!desc || !REPLIES[key]) return r;
  return {pic:r.pic, line:`네! ${desc} ${key} 그림이에요.`};
}

const PRAISES = ['참 잘했어요!','정말 멋져요!','최고예요!','아주 잘했어요!'];
let praiseN = 0;
function praise(cb){
  const t = PRAISES[praiseN++ % PRAISES.length];
  $('#praise').innerHTML = `<div class="pop"><span class="pe">🎉</span>${t}</div>`;
  $('#praise').hidden = false;
  speak(t);
  setTimeout(() => { $('#praise').hidden = true; cb && cb(); }, 1800);
}

/* ===== 진행/화면 전환 ===== */
function renderDots(){
  const m = MODULES[S.mi];
  dots.innerHTML = (S.screen === 'play' && m)
    ? m.steps.map((_,i) => `<span class="d ${i < S.si ? 'done' : i === S.si ? 'cur' : ''}"></span>`).join('')
    : '';
}
function runStep(){
  const m = MODULES[S.mi], step = m.steps[S.si];
  S.screen = 'play';
  renderDots();
  speak(step.text);
  RUN[step.type](step, stage);
}
function nextStep(){
  const m = MODULES[S.mi];
  if(S.si >= m.steps.length - 1){ saveDone(m.id); celebrate(m); }
  else { S.si++; runStep(); }
}
function winStep(){
  if(busy) return;
  busy = true;
  praise(() => { busy = false; nextStep(); });
}
function celebrate(m){
  S.screen = 'celebrate';
  renderDots();
  if(MODULES.every(x => done[x.id])){ finale(); return; }
  stage.innerHTML = `<div class="celebrate">
    <span class="ce">🏆</span>
    <h2>${m.doneMsg}</h2>
    <div class="btns">
      <button class="big-btn green" id="againBtn" type="button">🔄 한 번 더</button>
      <button class="big-btn" id="homeBtn2" type="button">🏠 처음으로</button>
    </div>
  </div>`;
  speak(m.doneMsg);
  $('#againBtn').onclick = () => { S.si = 0; runStep(); };
  $('#homeBtn2').onclick = goHome;
}
function finale(){
  const E = ['🎉','🎊','⭐','🌸'];
  const conf = Array.from({length:16}, (_, i) =>
    `<span style="left:${(i * 6.3 + 2) % 96}%; animation-duration:${2.6 + (i % 5) * .5}s; animation-delay:${(i % 7) * .45}s">${E[i % 4]}</span>`).join('');
  stage.innerHTML = `<div class="confetti" aria-hidden="true">${conf}</div>
    <div class="celebrate">
      <span class="ce">🎓</span>
      <h2>AI에게 그림을 부탁할 수 있어요!</h2>
      <p class="fin-sub">연습하기 ✅&ensp;자세히 말하기 ✅&ensp;진짜 AI ✅<br>정말 대단해요!</p>
      <div class="btns">
        <button class="big-btn green" id="againBtn" type="button">🔄 한 번 더</button>
        <button class="big-btn" id="homeBtn2" type="button">🏠 처음으로</button>
      </div>
    </div>`;
  speak('와! AI에게 그림을 부탁하는 방법을 모두 배웠어요. 정말 대단해요!');
  $('#againBtn').onclick = () => { S.si = 0; runStep(); };
  $('#homeBtn2').onclick = goHome;
}
function startModule(i){
  S.mi = i; S.si = 0;
  $('#title').textContent = MODULES[i].title;
  runStep();
}

        ${done[m.id] ? '<span class="badge">✅ 해냈어요</span>' : ''}
        <span class="cicon">${m.icon}</span>
        <span class="cname">${m.title}</span>
      </button>`).join('')}
    </div>
    <a class="pickerlink" href="index.html">📚 다른 수업 고르기</a>
  </div>`;
  lastTts = '하고 싶은 공부를 눌러 보세요.';
  stage.querySelectorAll('.card').forEach(c => c.onclick = () => startModule(+c.dataset.i));
}
$('#homeBtn').onclick = e => { e.currentTarget.blur(); goHome(); };

/* ===== 문장 만들기 화면 =====
   위쪽(문장칸·트레이·버튼)은 늘 같은 자리에 있고
   아래 .swap 한 칸만 낱말카드 ↔ AI창으로 바뀐다.
   둘을 동시에 두면 1024×600에 들어가지 않는다. */
function buildShell(step, bottomBtn){
  return `<p class="say" role="status">${step.text}</p>
    <div class="buildwrap">
      <div class="sentence" id="sentence" aria-live="polite"></div>
      <div class="tray" id="tray">
        <span class="tico" aria-hidden="true">📋</span>
        <span class="ttext" id="trayText">아직 비어 있어요</span>
      </div>
      <div class="actionrow" id="actionrow"></div>
      <div class="swap" id="swap"></div>
      <p class="hintline" id="buildHint" role="status"></p>
    </div>
    <div class="btnrow">${bottomBtn}</div>`;
}
function resetBuild(step){
  S.filled = {}; S.clip = ''; S.copied = false; S.pasted = false; S.phase = 'build';
  /* 스텝마다 먼저 보여 줄 갈래를 정할 수 있다(연습은 갈래별로 돌아가며 본다).
     번호는 '이 스텝이 쓰는 갈래' 안에서 센다 — 2칸 스텝엔 '어떤' 갈래가 없다. */
  const roles = step.slots.map(s => s.role);
  const mine = GROUPS.filter(g => roles.includes(groupRole(g)));
  S.gi = Math.max(0, mine.findIndex(g => g.id === (step && step.group)));
}
/* 낱말을 고르는 중인지 — 이때만 트레이·버튼을 얇게 줄여 카드 자리를 넓힌다 */
function markPicking(){
  const w = document.querySelector('.buildwrap');
  if(w) w.classList.toggle('picking', !S.copied);
}
/* 만든 문장을 다시 그린다 — 칸이 몇 개든 slots를 그대로 따라간다 */
function renderSentence(step){
  markPicking();
  const box = $('#sentence');
  if(!box) return;
  box.innerHTML = step.slots.map(s => {
    const w = S.filled[s.role];
    return w ? `<span class="sl on">${w}</span>`
             : `<span class="sl"><i>${s.label}</i></span>`;
  }).join('');
  box.classList.toggle('ready', isComplete(step));
}
/* 낱말 카드 — 갈래를 먼저 고르고, 그 갈래 안에서 낱말을 고른다.
   한 화면에 다 펼치면 20장이 넘어 고르기 어렵고 1024×600에서 넘친다.
   ★ 아무 순서로 눌러도 자기 역할의 칸에 들어간다. 틀릴 수가 없다. */
function renderWordCards(step, onPick){
  const wrap = $('#swap');
  if(!wrap) return;
  const lock = S.copied ? ' disabled' : '';

  /* 이 스텝이 쓰는 갈래만 — 2칸 스텝에서는 '어떤' 갈래가 아예 안 보인다 */
  const roles = step.slots.map(s => s.role);
  const mine = GROUPS.filter(g => roles.includes(groupRole(g)));

  /* 칸(slot)마다 열을 하나씩 만든다. 열은 자기 칸의 갈래 탭과 낱말만 담는다.
     갈래가 없는 칸('해 줘')은 탭 없이 카드만 둔다. */
  const cols = step.slots.map(s => ({
    slot: s,
    gs: mine.filter(x => groupRole(x) === s.role),
    cards: step.cards.filter(c => c.role === s.role),
  }));

  /* S.gi는 갈래 전체(mine) 기준 번호 하나뿐이다.
     열마다 '지금 보고 있는 갈래'가 따로 필요하므로, 고른 갈래가 이 열에 없으면
     그 열의 첫 갈래를 보여 준다 — 다른 열의 탭을 눌러도 내 열은 그대로다. */
  const shownFor = col => col.gs.includes(mine[S.gi]) ? mine[S.gi] : col.gs[0];

  wrap.innerHTML = `<div class="slotcols">
    ${cols.map(col => {
      const g = shownFor(col);
      const items = g
        ? g.items.map(it => ({role:groupRole(g), word:it.word, pic:it.pic}))
        : col.cards;
      const gRole = g ? groupRole(g) : col.slot.role;
      return `<div class="slotcol${col.gs.length ? '' : ' thin'}${S.filled[col.slot.role] ? ' filled' : ''}">
        <div class="slothead">${col.slot.label}${S.filled[col.slot.role] ? ' ✅' : ''}</div>
        ${col.gs.length ? `<div class="grouprow" role="tablist" aria-label="${col.slot.label} 갈래 고르기">
          ${col.gs.map(x => {
            const i = mine.indexOf(x), on = x === g;
            return `<button class="gtab${on ? ' on' : ''}" type="button" role="tab"
               aria-selected="${on}" data-g="${i}"${lock}>
               <span class="gpic" aria-hidden="true">${x.icon}</span>
               <span class="gtxt">${x.name}</span>
             </button>`;
          }).join('')}
        </div>` : ''}
        <div class="colcards">
          <div class="wordcards">
            ${items.map(it =>
              `<button class="wcard${it.role === 'do' ? ' do' : ''}${S.filled[it.role] === it.word ? ' used' : ''}"
                 type="button" data-r="${it.role}" data-w="${it.word}"${lock}>
                 <span class="wpic" aria-hidden="true">${it.pic}</span>
                 <span class="wtxt">${it.word}</span>
               </button>`).join('')}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // 갈래 바꾸기 — 고른 낱말은 그대로 두고 보여 주는 목록만 바꾼다
  wrap.querySelectorAll('.gtab').forEach(b => {
    b.onclick = e => {
      e.currentTarget.blur();
      S.gi = +b.dataset.g;               // mine 기준 번호다(스텝이 쓰는 갈래만)
      speak(mine[S.gi].name);
      onPick();
    };
  });
  wrap.querySelectorAll('.wcard').forEach(b => {
    b.onclick = e => {
      e.currentTarget.blur();
      const role = b.dataset.r || 'what';
      S.filled[role] = b.dataset.w;   // 누른 순서와 무관 — 역할이 자리를 정한다
      speak(b.dataset.w);             // 못 읽는 학생을 위해 반드시 읽어 준다
      onPick();
    };
  });
}

/* ===== 단계 실행기 ===== */
const RUN = {
  info(step, el){
    el.innerHTML = `<p class="say" role="status">${step.text}</p>${step.scene()}
      <div class="btnrow"><button class="big-btn" id="nextBtn" type="button">다음 ▶</button></div>`;
    $('#nextBtn').onclick = e => { e.currentTarget.blur(); nextStep(); };
  },

  /* 연습 — 만들기 → 복사 → 붙여넣기 → 연습용 AI가 그림으로 답 */
  build(step, el){
    resetBuild(step);
    el.innerHTML = buildShell(step,
      '<button class="big-btn" id="nextBtn" type="button" disabled>다음 ▶</button>');
    $('#nextBtn').onclick = e => { e.currentTarget.blur(); winStep(); };
    renderBuild(step);
  },

  /* 진짜 AI — 만들기 → 복사 → 새 탭에서 붙여넣기 → 학생이 스스로 마무리 */
  real(step, el){
    resetBuild(step);
    el.innerHTML = buildShell(step,
      '<button class="big-btn green" id="doneBtn" type="button" disabled>👍 해봤어요</button>');
    $('#doneBtn').onclick = e => { e.currentTarget.blur(); winStep(); };
    renderReal(step);
  },

  recap(step, el){
    el.innerHTML = `<p class="say" role="status">${step.text}</p>
      <div class="recap">
        <div class="ri" aria-hidden="true">${step.icon}</div>
        <h2>${step.title}</h2>
        <p>${step.body}</p>
        ${step.keys ? `<div class="keys">${step.keys.map(k => `<span>${k}</span>`).join('')}</div>` : ''}
        ${step.soft ? `<p class="soft" style="margin-top:16px">${step.soft}</p>` : ''}
      </div>
      <div class="btnrow"><button class="big-btn green" id="nextBtn" type="button">다 알았어요 ▶</button></div>`;
    $('#nextBtn').onclick = e => { e.currentTarget.blur(); winStep(); };
  },
};

/* 연습 화면을 통째로 다시 그린다 */
function renderBuild(step){
  renderSentence(step);
  const act = $('#actionrow'), hint = $('#buildHint'), next = $('#nextBtn');
  const complete = isComplete(step);

  if(S.copied){
    // 복사가 끝나면 낱말 카드 자리를 AI창이 대신한다
    const swap = $('#swap');
    if(swap && !$('#aiwin')){
      swap.innerHTML = `<div class="aiwin" id="aiwin">
        <div class="aiin" id="aiInput" aria-live="polite"></div>
        <div class="aiout" id="aiOut" hidden>
          <div class="aipic" id="aiPic" role="img" aria-label=""></div>
          <div class="ailine" id="aiLine"></div>
        </div>
      </div>`;
    }
    if(S.pasted){
      const inp = $('#aiInput');
      if(inp) inp.textContent = S.clip;
    }
  } else {
    renderWordCards(step, () => renderBuild(step));
  }

  act.innerHTML =
    `<button class="actbtn" id="copyBtn" type="button"${(!complete || S.copied) ? ' disabled' : ''}>📋 복사</button>
     <button class="actbtn green" id="pasteBtn" type="button"${(!S.copied || S.pasted) ? ' disabled' : ''}>📥 붙여넣기</button>`;
  $('#copyBtn').onclick = e => {
    e.currentTarget.blur();
    doCopy(step, () => renderBuild(step));
  };
  $('#pasteBtn').onclick = e => { e.currentTarget.blur(); doPaste(step); };

  if(hint) hint.textContent =
      !complete ? '낱말을 눌러 빈칸을 채워요'
    : !S.copied ? '이제 📋 복사를 눌러요'
    : !S.pasted ? '이제 📥 붙여넣기를 눌러요'
    : S.phase === 'done' ? '잘했어요! 다음으로 갈 수 있어요'
    : 'AI가 그리고 있어요';
  if(next) next.disabled = S.phase !== 'done';
}

/* 붙여넣기 — 진짜 클립보드를 읽지 않는다.
   navigator.clipboard.readText()는 크롬에서 권한 창을 띄우는데,
   학생이 '차단'을 누르면 되돌리는 길이 주소창 자물쇠뿐이라 그대로 막혀 버린다.
   교육 목적(복사 다음에 붙여넣기)에는 S.clip으로 충분하다. */
function doPaste(step){
  if(S.pasted || !S.clip) return;
  S.pasted = true;
  S.phase = 'paste';
  renderBuild(step);
  speak('붙여넣었어요');
  setTimeout(() => {
    const out = $('#aiOut');
    if(!out) return;
    const r = replyFor(step);
    out.hidden = false;
    const pic = $('#aiPic');
    pic.textContent = r.pic;
    pic.setAttribute('aria-label', r.line);   // 그림 대신 읽어 줄 글
    $('#aiLine').textContent = r.line;
    S.phase = 'done';
    speak(r.line);
    renderBuild(step);
  }, 800);
}

/* 진짜 AI 화면 — 복사까지 하면 제미나이로 나가는 문이 열린다 */
function renderReal(step){
  renderSentence(step);
  const act = $('#actionrow'), hint = $('#buildHint'), done2 = $('#doneBtn');
  const complete = isComplete(step);

  if(S.copied){
    const swap = $('#swap');
    if(swap && !$('#guide')){
      swap.innerHTML = `<div id="guide">
        <div class="guide">
          <div class="gstep"><b>1</b> 제미나이를 열어요</div>
          <div class="gstep"><b>2</b> 네모 칸을 눌러요</div>
          <div class="gstep"><b>3</b> <kbd>Ctrl</kbd> + <kbd>V</kbd> 를 눌러요</div>
        </div>
        <div class="extwrap">
          <a class="big-btn ext" id="geminiBtn" href="https://gemini.google.com/app"
             target="_blank" rel="noopener noreferrer">🌐 제미나이 열기</a>
        </div>
      </div>`;
    }
  } else {
    renderWordCards(step, () => renderReal(step));
  }

  // 진짜 AI에게는 붙여넣기를 직접 하므로 복사 버튼만 둔다
  act.innerHTML =
    `<button class="actbtn" id="copyBtn" type="button"${(!complete || S.copied) ? ' disabled' : ''}>📋 복사</button>`;
  $('#copyBtn').onclick = e => {
    e.currentTarget.blur();
    doCopy(step, () => {
      renderReal(step);
      speak('제미나이를 열고 컨트롤 브이를 눌러요');
    });
  };

  /* 복사한 뒤에는 아래 안내 3줄이 같은 말을 하고 있다.
     1024×600에서는 한 줄이 아쉬우니 그때는 힌트를 비운다. */
  if(hint) hint.textContent =
      !complete ? '낱말을 눌러 빈칸을 채워요'
    : !S.copied ? '이제 📋 복사를 눌러요'
    : '';
  /* 붙여넣었는지는 앱이 확인할 수 없고, 확인하려 하지도 않는다.
     탭이 바뀐 걸로 자동 진행하면 실수로 넘어가고 학생은 이유를 모른다.
     버튼은 하나뿐 — '못 했어요'를 두면 그게 곧 실패 상태가 된다. */
  if(done2) done2.disabled = !S.copied;
}

goHome();
</script>
